[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradient-boosted-trees-from-scratch"
version = "0.1.0"
description = "Histogram-based gradient boosted decision trees (regression + binary classification), implemented from scratch in NumPy."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyflakes>=3.0",
]

[project.scripts]
gbdt = "gbdt.cli:main"

[tool.setuptools]
packages = ["gbdt"]
